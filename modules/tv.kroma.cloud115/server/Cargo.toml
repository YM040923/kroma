[workspace]

[package]
name = "kroma-cloud115"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "KROMA 115 drive module: the account, the mirror into .strm, 302 playback and tidying."
license = "AGPL-3.0-or-later"

[[bin]]
name = "kroma-module-cloud115"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk" }
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "form", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"

[profile.dev]
debug = false
