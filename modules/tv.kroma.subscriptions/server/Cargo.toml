[workspace]

[package]
name = "kroma-subscriptions"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "AGPL-3.0-or-later"

[[bin]]
name = "kroma-module-subscriptions"
path = "src/bin/module.rs"

[dependencies]
kroma-module-sdk = { path = "../../../server/crates/kroma-module-sdk" }
kroma-module-runtime = { path = "../../../server/crates/kroma-module-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query", "matched-path"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.release-kmod]
inherits = "release"
panic = "abort"
