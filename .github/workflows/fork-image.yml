name: Build image for my fork

# A personal build: one Docker image (linux/amd64), pushed to this fork's
# GitHub Container Registry. Nothing here publishes a Release, tags a version
# or touches the upstream fleet workflow — it exists so a fork can run a build
# of its own commits without a compiler on the developer's machine.
#
# Run it from the Actions tab ("Run workflow"), or:
#   gh workflow run fork-image.yml --repo <owner>/kroma
#
# The image lands at ghcr.io/<owner>/kroma:fork, and pullable with the
# repository's own GITHUB_TOKEN from a logged-in `docker login ghcr.io`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: fork)'
        required: false
        type: string
        default: fork
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/core/src/locales/**'
      - 'clients/web/**'
      - 'packages/**'
      - '.github/workflows/fork-image.yml'

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry name is lowercase only, and this owner keeps its capitals
      # (YM040923), so the image name is folded down before it is used.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag || 'fork' }}" >> "$GITHUB_OUTPUT"

      # server/Dockerfile is the from-source build: it compiles the web SPA with
      # bun and the Rust server with cargo, then assembles a runtime image. The
      # commit metadata is passed as build args because .git is not in the
      # context, which is what the admin page reports as its version.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            KROMA_GIT_HASH=${{ github.sha }}
            KROMA_GIT_HASH_FULL=${{ github.sha }}
            KROMA_GIT_BRANCH=${{ github.ref_name }}
            KROMA_GIT_REMOTE=${{ github.server_url }}/${{ github.repository }}
            KROMA_BUILD_DIRTY=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
